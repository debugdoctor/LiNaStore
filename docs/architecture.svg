<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="560" viewBox="0 0 1240 560" font-family="monospace">
<rect x="0" y="0" width="1240" height="560" fill="#fafafa"/>
<defs><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#444"/></marker></defs>
<rect x="30" y="90" width="240" height="150" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="150.0" y="108" text-anchor="middle" font-family="monospace" font-size="13" font-weight="bold" fill="#111">Client / Frontend</text><text x="150.0" y="123" text-anchor="middle" font-family="monospace" font-size="10.5" fill="#333">HTTP / S3 / Advanced</text><text x="150.0" y="136" text-anchor="middle" font-family="monospace" font-size="10.5" fill="#333">parse request headers</text><text x="150.0" y="149" text-anchor="middle" font-family="monospace" font-size="10.5" fill="#333">await admission permit</text><text x="150.0" y="162" text-anchor="middle" font-family="monospace" font-size="10.5" fill="#333">read + push body chunks</text><text x="150.0" y="175" text-anchor="middle" font-family="monospace" font-size="10.5" fill="#333">write response stream</text>
<rect x="30" y="270" width="240" height="100" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/><text x="150.0" y="288" text-anchor="middle" font-family="monospace" font-size="13" font-weight="bold" fill="#111">Admission (in-flight)</text><text x="150.0" y="303" text-anchor="middle" font-family="monospace" font-size="10.5" fill="#333">semaphore: full -&gt; await</text><text x="150.0" y="316" text-anchor="middle" font-family="monospace" font-size="10.5" fill="#333">30s timeout -&gt; 503</text><text x="150.0" y="329" text-anchor="middle" font-family="monospace" font-size="10.5" fill="#333">body not yet read</text>
<rect x="320" y="90" width="230" height="60" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="2"/><text x="435.0" y="108" text-anchor="middle" font-family="monospace" font-size="13" font-weight="bold" fill="#111">order_queue (meta)</text><text x="435.0" y="123" text-anchor="middle" font-family="monospace" font-size="10" fill="#333">intent only</text><text x="435.0" y="136" text-anchor="middle" font-family="monospace" font-size="10" fill="#333">cap 128</text>
<rect x="320" y="180" width="230" height="70" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="2"/><text x="435.0" y="198" text-anchor="middle" font-family="monospace" font-size="13" font-weight="bold" fill="#111">payload channel (data)</text><text x="435.0" y="213" text-anchor="middle" font-family="monospace" font-size="10" fill="#333">bounded mpsc</text><text x="435.0" y="226" text-anchor="middle" font-family="monospace" font-size="10" fill="#333">depth = 64 × chunk</text><text x="435.0" y="239" text-anchor="middle" font-family="monospace" font-size="10" fill="#333">send().await backpressure</text>
<rect x="610" y="90" width="260" height="160" rx="8" fill="#e0e7ff" stroke="#6366f1" stroke-width="2"/><text x="740.0" y="108" text-anchor="middle" font-family="monospace" font-size="13" font-weight="bold" fill="#111">Worker (porter task)</text><text x="740.0" y="123" text-anchor="middle" font-family="monospace" font-size="10.5" fill="#333">1 request = 1 task</text><text x="740.0" y="136" text-anchor="middle" font-family="monospace" font-size="10.5" fill="#333">active = ⌊ cpus/2 ⌋</text><text x="740.0" y="149" text-anchor="middle" font-family="monospace" font-size="10.5" fill="#333">real work only holds slot</text><text x="740.0" y="162" text-anchor="middle" font-family="monospace" font-size="10.5" fill="#333">stream payload -&gt; storage</text><text x="740.0" y="175" text-anchor="middle" font-family="monospace" font-size="10.5" fill="#333">stream response</text>
<rect x="910" y="90" width="120" height="160" rx="8" fill="#fce7f3" stroke="#db2777" stroke-width="2"/><text x="970.0" y="108" text-anchor="middle" font-family="monospace" font-size="13" font-weight="bold" fill="#111">io wait</text><text x="970.0" y="123" text-anchor="middle" font-family="monospace" font-size="10.5" fill="#333">channel / DB / socket</text><text x="970.0" y="136" text-anchor="middle" font-family="monospace" font-size="10.5" fill="#333">→ await park</text>
<rect x="320" y="290" width="230" height="160" rx="8" fill="#ecfdf5" stroke="#0d9488" stroke-width="2"/><text x="435.0" y="308" text-anchor="middle" font-family="monospace" font-size="13" font-weight="bold" fill="#111">storage (file IO)</text><text x="435.0" y="323" text-anchor="middle" font-family="monospace" font-size="10" fill="#333">PUT: mem ≤ 4MB else spool</text><text x="435.0" y="336" text-anchor="middle" font-family="monospace" font-size="10" fill="#333">incremental BLAKE3</text><text x="435.0" y="349" text-anchor="middle" font-family="monospace" font-size="10" fill="#333">dedup → link → DB</text><text x="435.0" y="362" text-anchor="middle" font-family="monospace" font-size="10" fill="#333">GET: open_read stream</text>
<rect x="610" y="290" width="260" height="160" rx="8" fill="#e2e8f0" stroke="#475569" stroke-width="2"/><text x="740.0" y="308" text-anchor="middle" font-family="monospace" font-size="13" font-weight="bold" fill="#111">sql queue</text><text x="740.0" y="323" text-anchor="middle" font-family="monospace" font-size="10.5" fill="#333">DbExecutor</text><text x="740.0" y="336" text-anchor="middle" font-family="monospace" font-size="10.5" fill="#333">single thread</text><text x="740.0" y="349" text-anchor="middle" font-family="monospace" font-size="10.5" fill="#333">serial metadata ops</text>
<line x1="150" y1="240" x2="150" y2="270" stroke="#2563eb" stroke-width="3" marker-start="url(#b)" marker-end="url(#b)"/><text x="160" y="258" text-anchor="start" font-family="monospace" font-size="10.5" fill="#2563eb">await permit</text>
<line x1="270" y1="120" x2="320" y2="120" stroke="#2563eb" stroke-width="3" marker-end="url(#b)"/><text x="295" y="108" text-anchor="middle" font-family="monospace" font-size="10.5" fill="#2563eb">meta</text>
<line x1="270" y1="215" x2="320" y2="215" stroke="#0d9488" stroke-width="3" marker-end="url(#b)"/><text x="295" y="203" text-anchor="middle" font-family="monospace" font-size="10.5" fill="#0d9488">body chunks</text>
<line x1="550" y1="120" x2="610" y2="120" stroke="#2563eb" stroke-width="3" stroke-dasharray="6,4" marker-end="url(#b)"/><text x="580" y="108" text-anchor="middle" font-family="monospace" font-size="10.5" fill="#2563eb">dequeue</text>
<line x1="550" y1="215" x2="610" y2="215" stroke="#0d9488" stroke-width="3" stroke-dasharray="6,4" marker-end="url(#b)"/><text x="580" y="203" text-anchor="middle" font-family="monospace" font-size="10.5" fill="#0d9488">pull</text>
<line x1="870" y1="170" x2="910" y2="170" stroke="#2563eb" stroke-width="2" stroke-dasharray="6,4" marker-start="url(#b)" marker-end="url(#b)"/><text x="890" y="158" text-anchor="middle" font-family="monospace" font-size="10.5" fill="#2563eb">park | resume</text>
<line x1="700" y1="250" x2="435" y2="290" stroke="#0d9488" stroke-width="3" marker-start="url(#b)" marker-end="url(#b)"/><text x="570" y="276" text-anchor="middle" font-family="monospace" font-size="10.5" fill="#0d9488">file IO</text>
<line x1="730" y1="250" x2="750" y2="290" stroke="#2563eb" stroke-width="2" marker-start="url(#b)" marker-end="url(#b)"/><text x="770" y="276" text-anchor="middle" font-family="monospace" font-size="10.5" fill="#2563eb">metadata</text>
<polyline points="800,90 800,40 150,40 150,90" fill="none" stroke="#ea580c" stroke-width="3" marker-end="url(#b)"/><text x="500" y="32" text-anchor="middle" font-family="monospace" font-size="10.5" fill="#ea580c">response stream (GET data / PUT ack)</text>
<text x="435" y="475" text-anchor="middle" font-family="monospace" font-size="10.5" fill="#0d9488">PUT after admission: payload channel full -&gt; send().await -&gt;</text>
<text x="435" y="492" text-anchor="middle" font-family="monospace" font-size="10.5" fill="#0d9488">frontend stops reading socket -&gt; TCP backpressure pauses client</text>
<text x="435" y="509" text-anchor="middle" font-family="monospace" font-size="10.5" fill="#dc2626">waiting requests never start their body; only 30s admission timeout -&gt; 503</text>
<text x="1040" y="500" text-anchor="start" font-family="monospace" font-size="10.5" fill="#111">legend:</text>
<text x="1040" y="516" text-anchor="start" font-family="monospace" font-size="10.5" fill="#111">blue = meta/control   teal = PUT body   orange = GET response</text>
<text x="1040" y="532" text-anchor="start" font-family="monospace" font-size="10.5" fill="#111">dashed = backpressure / io-wait</text>
</svg>